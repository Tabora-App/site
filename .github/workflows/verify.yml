name: Verify

# Rebuilds the site in a clean directory and compares it byte for byte with the committed public/.
# Third-party actions are pinned to a full commit SHA (the tag is in the comment).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild and compare
        run: sh verify.sh
